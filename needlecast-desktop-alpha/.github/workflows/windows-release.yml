name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Node dependencies
        run: npm install
      - name: Verify JavaScript and Python syntax
        run: |
          npm run check
          npm test
          python -m py_compile capture-agent/capture_agent.py capture-agent/capture_agent_bootstrap.py
      - name: Package capture agent
        shell: pwsh
        run: ./scripts/build-capture-agent.ps1
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: needlecast-windows-installer
          path: release/*.exe
          if-no-files-found: error
      - name: Attach installer to GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
